[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recruit"
version = "0.1.0"
description = "Football player recruitment on a budget: StatsBomb 2015/16 profiles, similarity and market value"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "realdata: reads the real files in data/raw/ and data/processed/ (slow; run with: pytest -m realdata)",
]
addopts = "-m 'not realdata'"
